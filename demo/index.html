const LANG_KEY = 'lpk-lang';
const SUPPORTED_LANGS = ['zh', 'en'];

function detectLang() {
  const urlLang = new URLSearchParams(location.search).get('lang');
  if (urlLang === 'zh' || urlLang === 'en') return urlLang;
  let stored = null;
  try { stored = localStorage.getItem(LANG_KEY); } catch { /* 隐私模式下忽略 */ }
  if (stored === 'zh' || stored === 'en') return stored;
  return 'zh';
}

let lang = detectLang();

function t(key, vars) {
  const dict = I18N[lang] ?? I18N.zh;
  let s = dict[key] ?? I18N.zh[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, String(v));
  return s;
}

function countLabel(key, n) {
  if (lang === 'en' && n === 1) return t(`${key}One`, { n });
  return t(key, { n });
}

function applyLangState() {
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  // 保留 ?provider= / ?agent= 等既有深链参数，仅更新 lang。
  history.replaceState(null, '', url.pathname + url.search);
  try { localStorage.setItem(LANG_KEY, lang); } catch { /* 隐私模式下忽略 */ }
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
}

    'Only sets the default; users can still switch models during the conversation',
  '本地会话，无公开端点': 'Local session, no public endpoint',
};
const OPT_LABEL_EN = { '默认端点': 'Default endpoint' };
const optLabel = (label) => (lang === 'en' ? (OPT_LABEL_EN[label] ?? label) : label);

function locField(field) {
  if (lang !== 'en') return field;
  const std = STD_FIELD_EN[field.label];
  const out = { ...field };
  if (std?.label) out.label = std.label;
  if (std?.placeholder && out.placeholder === field.placeholder) out.placeholder = std.placeholder;
  if (field.help && HELP_EN[field.help]) out.help = HELP_EN[field.help];
  return out;
}
const kindLabel = (key) => KIND_LABEL[lang][key] ?? key;
const groupLabel = (key) => GROUP_LABEL[lang][key] ?? key;

const FOOT_LINK_HTML = '<a href="https://github.com/lawson2019/llm-provider-kit/blob/main/data/providers.json" target="_blank" rel="noopener">data/providers.json</a>';

const DEMO_PARAMS = new URLSearchParams(location.search);

const state = {
  mode: DEMO_PARAMS.get('agent') ? 'agents' : 'providers',
  category: '',
  query: '',
  selectedProvider: DEMO_PARAMS.get('provider') ?? DATA.providers?.[0]?.id ?? null,
  selectedAgent: DEMO_PARAMS.get('agent') ?? DATA.agents?.[0]?.id ?? null,
  values: {},
  showAdvanced: false,
  errors: {},
};

for (const p of DATA.providers ?? []) {
  const v = {};
  for (const f of p.formFields ?? []) {
    if (f.default !== undefined) v[f.key] = f.default;
  }
  state.values[p.id] = v;
}

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

function initials(name) {
  const latin = name.replace(/[^A-Za-z0-9]/g, '');
  if (latin) return latin.slice(0, 2).toUpperCase();
  return name.slice(0, 1);
}

function logoNode(provider, big = false) {
  const wrap = el('span', big ? 'logo' : 'logo');
  wrap.style.setProperty('--brand', provider.icon?.color || provider.brandColor || '#0f766e');
  wrap.appendChild(el('span', 'mono', initials(provider.name)));
  const icon = provider.icon ?? {};
  const src = icon.url || (icon.source === 'lobe-icons' && icon.slug
    ? `https://unpkg.com/@lobehub/icons-static-svg@latest/icons/${icon.slug}.svg`
    : '');
  if (src) {
    const img = new Image();
    img.alt = '';
    img.loading = 'eager';
    img.decoding = 'async';
    img.src = src;
    img.addEventListener('load', () => {
      if (img.naturalWidth > 0) wrap.classList.add('has-img');
      else img.remove();
    });
    img.addEventListener('error', () => img.remove());
    wrap.appendChild(img);
  }
  return wrap;
}

function currentProviders() {
  if (!DATA.providers) return [];
  return DATA.providers.filter((p) => {
    if (state.category && p.category !== state.category) return false;
    if (!state.query) return true;
    const hay = [
      p.id, p.name, ...(p.aliases ?? []), p.kind,
      p.authType, p.auth?.mode, p.auth?.scheme,
      p.billing?.mode, p.quota?.type,
      ...(p.endpoints ?? []).flatMap((e) => [e.id, e.label, e.protocol, e.baseURL]),
    ].join(' ').toLowerCase();
    return hay.includes(state.query.toLowerCase());
  });
}

function renderChips() {
  const chips = document.getElementById('chips');
  chips.replaceChildren();
  chips.style.display = state.mode === 'agents' ? 'none' : 'flex';
  const all = el('button', `chip${state.category === '' ? ' on' : ''}`, t('chipAll', { n: DATA.providers.length }));
  all.onclick = () => { state.category = ''; renderChips(); renderList(); renderDetail(); };
  chips.appendChild(all);
  for (const [key, label] of Object.entries(CATEGORY_LABEL[lang])) {
    const count = DATA.providers.filter((p) => p.category === key).length;
    if (!count) continue;
    const chip = el('button', `chip${state.category === key ? ' on' : ''}`, `${label} ${count}`);
    chip.onclick = () => { state.category = state.category === key ? '' : key; renderChips(); renderList(); renderDetail(); };
    chips.appendChild(chip);

function providerBadges(p) {
  const box = el('div', 'badges');
  box.appendChild(el('span', `badge${p.kind === 'session' ? ' ses' : ''}`, kindLabel(p.kind)));
  box.appendChild(el('span', 'badge', p.auth?.mode ?? p.authType));
  box.appendChild(el('span', 'badge', `${p.auth?.scheme ?? p.authType}`));
  box.appendChild(el('span', 'badge', t('billingBadge', { mode: p.billing?.mode ?? p.quota?.type ?? '-' })));
  if (p.endpoints?.length > 1) box.appendChild(el('span', 'badge', t('endpointCount', { n: p.endpoints.length })));

function renderList() {
  const list = document.getElementById('list');
  list.replaceChildren();

  if (state.mode === 'agents') {
    const agents = (DATA.agents ?? []).filter((agent) => {
      if (!state.query) return true;
      const hay = [agent.id, agent.name, agent.vendor, ...(agent.transports ?? []), ...(agent.protocols ?? []), ...(agent.notes ?? [])]
        .join(' ').toLowerCase();
      return hay.includes(state.query.toLowerCase());
    });
    if (!agents.some((a) => a.id === state.selectedAgent)) {
      state.selectedAgent = agents[0]?.id ?? null;
    }
    if (agents.length === 0) {
      list.appendChild(el('div', 'empty', t('emptyAgent')));
      return;
    }
    for (const agent of agents) {
      const btn = el('button', `item${state.selectedAgent === agent.id ? ' on' : ''}`);
      const body = el('div', 'body');
      body.appendChild(el('div', 'name', agent.name));
      const meta = el('div', 'meta');
      meta.appendChild(el('span', '', (agent.transports ?? (agent.transport ? [agent.transport] : [])).join('+') || agent.kind));
      meta.appendChild(el('span', '', (agent.protocols ?? []).join(' · ') || '—'));
      if (agent.runtime?.backendMode) meta.appendChild(el('span', '', agent.runtime.backendMode));
      body.appendChild(meta);
      const badge = el('span', 'badge', agent.vendor ?? '');
      btn.append(body, badge);
      btn.onclick = () => { state.selectedAgent = agent.id; renderList(); renderDetail(); };
      list.appendChild(btn);
    }
    return;
  }

  const providers = currentProviders();
  if (providers.length === 0) {
    list.appendChild(el('div', 'empty', t('emptyProvider')));
    return;
  }
  if (!providers.some((p) => p.id === state.selectedProvider)) {
    state.selectedProvider = providers[0].id;

  for (const p of providers) {
    const btn = el('button', `item${state.selectedProvider === p.id ? ' on' : ''}`);

    body.appendChild(el('div', 'name', p.name));
    const meta = el('div', 'meta');
    meta.appendChild(el('span', '', p.kind));
    meta.appendChild(el('span', '', p.auth?.mode ?? p.authType));
    body.appendChild(meta);
    btn.appendChild(body);
    btn.onclick = () => { state.selectedProvider = p.id; state.errors = {}; renderList(); renderDetail(); };
    list.appendChild(btn);
  }
}

function currentProvider() {
  return (DATA.providers ?? []).find((p) => p.id === state.selectedProvider) ?? null;
}

function fieldControl(field, value, onChange, hasError) {
  const wrap = el('div', 'control');
  let input;

  if (field.type === 'select') {
    input = el('select');
    for (const option of field.options ?? []) {
      const opt = el('option', '', optLabel(option.label));
      opt.value = option.value;
      if (option.description) opt.title = option.description;
      input.appendChild(opt);
    }
    input.value = value ?? field.default ?? '';
  } else if (field.type === 'boolean') {
    input = el('input');
    input.type = 'checkbox';
    input.checked = Boolean(value ?? field.default);
    input.style.width = 'auto';
    wrap.classList.add('switch');
  } else if (field.type === 'textarea' || field.type === 'json') {
    input = el('textarea');
    input.value = value ?? field.default ?? '';
    input.placeholder = field.placeholder ?? '';
  } else if (field.type === 'number') {
    input = el('input');
    input.type = 'number';
    if (field.validate?.min !== undefined) input.min = field.validate.min;
    if (field.validate?.max !== undefined) input.max = field.validate.max;
    input.value = value ?? field.default ?? '';
  } else {
    input = el('input');
    input.type = field.type === 'password' ? 'password' : field.type === 'url' ? 'url' : 'text';
    input.value = value ?? field.default ?? '';
    input.placeholder = field.placeholder ?? '';
    input.autocomplete = 'off';
    input.spellcheck = false;
  }

  if (hasError) input.classList.add('bad');
  input.addEventListener('input', () => {
    const v = field.type === 'boolean' ? input.checked : input.value;
    onChange(v);
  });
  input.addEventListener('change', () => {
    const v = field.type === 'boolean' ? input.checked : input.value;
    onChange(v);
  });
  wrap.appendChild(input);

  if (field.type === 'password') {
    const peek = el('button', 'peek', t('show'));
    peek.type = 'button';
    peek.onclick = () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      peek.textContent = showing ? t('show') : t('hide');
    };
    wrap.appendChild(peek);
  }
  return wrap;
}

function renderForm(provider) {
  const box = el('div');

  if (provider.quotaWarning) {
    const banner = el('div', `banner ${provider.quotaWarning.level === 'warning' ? 'warn' : ''}`);
    banner.appendChild(el('strong', '', provider.quotaWarning.title));
    banner.appendChild(document.createTextNode(provider.quotaWarning.detail));
    box.appendChild(banner);
  }

  const values = state.values[provider.id] ?? (state.values[provider.id] = {});
  const groups = {};
  for (const f of provider.formFields ?? []) (groups[f.group ?? 'advanced'] ??= []).push(f);

  const basicGroups = Object.entries(groups).filter(([g]) => g !== 'advanced');
  const advanced = groups.advanced ?? [];

  for (const [group, fields] of basicGroups) {
    box.appendChild(renderGroup(provider, group, fields, values));
  }
  if (advanced.length) {
    const toggle = el('button', 'adv-toggle', state.showAdvanced ? t('advHide') : t('advShow', { n: advanced.length }));
    toggle.onclick = () => { state.showAdvanced = !state.showAdvanced; renderDetail(); };
    box.appendChild(toggle);
    if (state.showAdvanced) box.appendChild(renderGroup(provider, 'advanced', advanced, values));
  }

  const out = el('div', 'output');
  const head = el('div', 'output-head');
  head.appendChild(el('span', '', t('outputTitle')));
  const acts = el('div', 'acts');
  const gen = el('button', 'mini', t('validateBtn'));
  const copy = el('button', 'mini', t('copyBtn'));
  acts.append(gen, copy);
  head.appendChild(acts);
  out.appendChild(head);

  const pre = el('pre');
  const problems = el('div', 'problems');
  out.append(pre, problems);

  const update = () => {
    const config = buildConfig(provider, values);
    pre.textContent = JSON.stringify(config, null, 2);
    if (Object.keys(state.errors).length) {
      problems.classList.add('on');
      problems.textContent = t('missingFields', { keys: Object.keys(state.errors).join(t('listSep')) });
    } else {
      problems.classList.remove('on');
      problems.textContent = '';
    }
  };

  gen.onclick = () => {
    state.errors = {};
    for (const f of provider.formFields ?? []) {
      if (f.required && !String(values[f.key] ?? '').trim()) state.errors[f.key] = true;
    }
    renderDetail();
  };
  copy.onclick = async () => {
    const text = JSON.stringify(buildConfig(provider, values), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = t('copied');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      copy.textContent = t('copied');
    }
    setTimeout(() => (copy.textContent = t('copyBtn')), 1400);
  };

  update();
  box.appendChild(out);

  if (provider.notes?.length) {
    const notes = el('div', 'notes');
    const title = el('div', 'section-title');
    title.appendChild(el('h3', '', t('notesTitle')));
    notes.appendChild(title);
    const ul = el('ul');
    for (const note of provider.notes) ul.appendChild(el('li', '', note));
    notes.appendChild(ul);
    box.appendChild(notes);
  }

  return box;
}

function renderGroup(provider, group, fields, values) {
  const wrap = el('div', 'group');
  const head = el('div', 'group-head');
  head.appendChild(el('span', '', groupLabel(group)));
  head.appendChild(el('span', '', countLabel('fieldCount', fields.length)));
  const body = el('div', 'group-body');

  for (const rawField of fields) {
    const field = locField(rawField);
    const row = el('div', 'field');
    const label = el('label');
    label.appendChild(document.createTextNode(field.label));
    if (field.required) label.appendChild(el('span', 'req', t('tagRequired')));
    if (field.secret) label.appendChild(el('span', 'tag secret', t('tagSecret')));
    if (field.advanced) label.appendChild(el('span', 'tag', t('tagAdvanced')));
    body.appendChild(row);
    row.appendChild(label);

    const control = fieldControl(field, values[field.key], (v) => {
      values[field.key] = v;
      if (state.errors[field.key] && String(v).trim()) {
        delete state.errors[field.key];
      }
      refreshOutput(provider, values);
    }, Boolean(state.errors[field.key]));
    row.appendChild(control);

    if (field.help) row.appendChild(el('div', 'help', field.help));
    if (field.type === 'select' && field.options) {
      const active = field.options.find((o) => o.value === (values[field.key] ?? field.default));
      if (active?.description) row.appendChild(el('div', 'help', t('current', { desc: active.description })));
    }
  }

  wrap.append(head, body);
  return wrap;
}

function refreshOutput(provider, values) {
  const pre = document.querySelector('.output pre');
  if (!pre) return;
  pre.textContent = JSON.stringify(buildConfig(provider, values), null, 2);
}

function interpolate(template, values) {
  return template.replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => {
    const v = values[key];
    return v === undefined || v === null || v === '' ? `{${key}}` : String(v);
  });
}

function resolveEndpoint(provider, values) {
  const endpoints = provider.endpoints ?? [];
  const selectedValue = values.endpoint ?? values.endpointId;
  if (selectedValue !== undefined && selectedValue !== null && selectedValue !== '') {
    const selected = endpoints.find((e) => e.id === selectedValue || e.value === selectedValue);
    if (selected) return selected;
  }
  return endpoints.find((e) => e.default === true) ?? endpoints[0] ?? null;
}

const DEFAULT_ENDPOINT_PATH = {
  'openai-chat': '/chat/completions',
  'openai-responses': '/responses',
  'anthropic-messages': '/v1/messages',

function endpointPath(endpoint) {
  return endpoint?.path ?? (DEFAULT_ENDPOINT_PATH[endpoint?.protocol] ?? '');
}

const sliceLang = (typeof lang === 'string' && lang === 'en') ? 'en' : 'zh';
const st = SLICE_TEXT[sliceLang];

function endpointURL(endpoint) {
  if (!endpoint?.baseURL) return st.localSessionURL;
  const base = String(endpoint.baseURL).replace(/\/+$/, '');
  const path = endpointPath(endpoint);
  if (!path || base.endsWith(path)) return base;
  return `${base}${path.startsWith('/') ? '' : '/'}${path}`;
}

function maskCredential(value) {
  const raw = String(value ?? '');
  if (!raw) return '';
  if (raw.length <= 8) return '••••';
  return `${raw.slice(0, 4)}…${raw.slice(-4)}`;
}

function buildConfig(provider, values) {
  const headers = {};
  const query = {};
  const missing = [];
  const warnings = [];

  for (const f of provider.formFields ?? []) {
    const value = values[f.key] ?? f.default;
    if (f.required && !String(value ?? '').trim()) missing.push(f.key);
  }

  const endpoint = resolveEndpoint(provider, values);
  let baseURL = values.baseURL || endpoint?.baseURL || provider.baseURL || '';
  if (provider.baseURLTemplate) baseURL = interpolate(provider.baseURLTemplate, values);
  else if (baseURL.includes('{')) baseURL = interpolate(baseURL, values);
  if (provider.kind === 'session') baseURL = st.sessionBaseURL;

  const auth = provider.auth ?? {};
  const endpointAuth = endpoint?.auth ?? {};
  const authMode = endpointAuth.mode ?? auth.mode ?? (provider.kind === 'session' ? 'local-session' : provider.authType === 'none' ? 'none' : 'api-key');
  const scheme = endpointAuth.scheme ?? auth.scheme ?? provider.authType;
  const headerName = endpointAuth.headerName ?? auth.headerName;
  const queryName = endpointAuth.queryName ?? auth.queryName;
  const credentialField = (provider.formFields ?? []).find((f) => f.secret === true);
  const credential = credentialField ? (values[credentialField.key] || '') : '';
  const masked = maskCredential(credential);

  const defaultPath = DEFAULT_ENDPOINT_PATH[endpoint?.protocol] ?? '';
  const path = endpoint?.path ?? defaultPath;
  let requestURL = baseURL ? String(baseURL).replace(/\/+$/, '') : '';
  if (requestURL && path && !requestURL.endsWith(path)) {
    requestURL = `${requestURL}${path.startsWith('/') ? '' : '/'}${path}`;
  }

  if (authMode === 'oauth' || authMode === 'device-code') {
    warnings.push(st.wOauth);
  }
  if (authMode === 'browser-cookie') {
    warnings.push(st.wCookie);
  }
  if (authMode === 'local-session') {
    warnings.push(st.wLocalSession);
  }

  switch (scheme) {
    case 'bearer':
      headers.Authorization = credential ? `Bearer ${masked}` : `Bearer ${st.phUnfilled}`;
      break;
    case 'api-key-header':
      headers[headerName ?? 'x-api-key'] = credential ? masked : st.phUnfilled;
      break;
    case 'query-param':
      query[queryName ?? 'key'] = credential ? masked : st.phUnfilled;
      break;
    case 'azure-api-key':
      headers['api-key'] = credential ? masked : st.phUnfilled;
      query['api-version'] = values.apiVersion || '2024-10-21';
      break;
    case 'aws-sigv4':
      headers['X-Amz-Date'] = st.awsDate;
      headers.Authorization = st.awsAuth;
      break;
    case 'cookie':
      headers.Cookie = credential ? masked : st.phUnfilled;
      break;
    case 'jwt-session':
      headers.Authorization = st.jwtSession;
      break;
  }

  for (const [name, value] of Object.entries(auth.extraHeaders ?? {})) {
    const resolved = interpolate(value, values);
    if (!resolved.includes('{')) headers[name] = resolved;
  }
  for (const [name, value] of Object.entries(endpoint?.headers ?? {})) {
    const resolved = interpolate(value, values);
    if (!resolved.includes('{')) headers[name] = resolved;
  }

  if (provider.kind === 'session') warnings.push(st.wSession);
  if (provider.risk && ['medium', 'high'].includes(provider.risk.level)) {
    warnings.push(st.wRisk.replaceAll('{level}', provider.risk.level).replaceAll('{note}', provider.risk.note));
  }
  if (provider.runtime?.forceStream) warnings.push(st.wStream);
  if (provider.runtime?.strictChatHistory) warnings.push(st.wHistory);

  return {
    baseURL,
    endpoint: endpoint?.id ?? 'default',
    protocol: endpoint?.protocol ?? 'unknown',
    path,
    requestURL,
    headers,
    query,
    missing,
    warnings,
    quota: provider.quota?.type,
    billing: provider.billing?.mode ?? provider.quota?.type,
    authMode,
    runtime: provider.runtime ?? null,
  };
}

      const li = el('li', '', `${optLabel(endpoint.label)} · ${endpoint.protocol} · ${endpoint.billing} · ${endpointURL(endpoint)}`);
      if (endpoint.default) li.appendChild(el('span', 'tag', t('defaultTag')));
      ul.appendChild(li);
    }
    ep.appendChild(ul);
    panel.appendChild(ep);
  }

  if (provider.auth?.oauth && (provider.auth.mode === 'oauth' || provider.auth.mode === 'device-code')) {
    const oauth = el('div', 'banner');
    oauth.appendChild(el('strong', '', `OAuth / ${provider.auth.mode}`));
    oauth.appendChild(document.createTextNode(
      t('oauthDetail', {
        initiate: provider.auth.oauth.initiateUrl ?? provider.auth.oauth.authUrl ?? '—',
        poll: provider.auth.oauth.pollUrlBase ?? provider.auth.oauth.tokenUrl ?? '—',
      })
    ));
    panel.appendChild(oauth);
  }

  if (provider.risk) {
    const risk = el('div', `banner ${provider.risk.level === 'high' ? 'warn' : ''}`);
    risk.appendChild(el('strong', '', t('riskTitle', { level: provider.risk.level, variant: provider.risk.variant })));
    risk.appendChild(document.createTextNode(`　${provider.risk.note}`));
    panel.appendChild(risk);
  }

  panel.appendChild(renderForm(provider));
  detail.appendChild(panel);
}

function renderAgentDetail() {
  const detail = document.getElementById('detail');
  detail.replaceChildren();
  const agent = (DATA.agents ?? []).find((a) => a.id === state.selectedAgent);
  if (!agent) {
    detail.appendChild(el('div', 'empty', t('emptyDetailAgent')));
    return;
  }
  const panel = el('div', 'detail');
  const h = el('div', 'd-head');
  const title = el('div', 'd-title');
  title.appendChild(el('h2', '', agent.name));
  title.appendChild(el('div', 'd-id', `${agent.id} · ${agent.vendor ?? ''}`));
  h.appendChild(title);
  if (agent.links?.[0]) {
    const link = el('a', 'd-link', `${agent.links[0].label} ↗`);
    link.href = agent.links[0].url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    h.appendChild(link);
  }
  panel.appendChild(h);

  const proto = el('div', 'proto');
  for (const tr of agent.transports ?? (agent.transport ? [agent.transport] : [])) proto.appendChild(el('span', '', t('transportBadge', { t: tr })));
  for (const p of agent.protocols ?? []) proto.appendChild(el('span', '', p));
  panel.appendChild(proto);

  const kv = el('div', 'kv');
  const row = (k, v) => {
    kv.appendChild(el('dt', '', k));
    kv.appendChild(el('dd', '', v));
  };
  row(t('kvType'), agent.kind);
  row(t('kvTransport'), (agent.transports ?? (agent.transport ? [agent.transport] : [])).join(' + ') || '—');
  row(t('kvProtocol'), (agent.protocols ?? []).join(' · ') || '—');
  row(t('kvBackendMode'), agent.runtime?.backendMode ?? '—');
  row(t('kvBinary'), agent.runtime?.binary ?? '—');
  row(t('kvInstall'), agent.install?.npm ? `npm i -g ${agent.install.npm}` : agent.install?.docs ?? '—');
  const paths = agent.configure?.paths;
  row(t('kvConfigPaths'), paths ? Object.entries(paths).map(([platform, list]) => `${platform}: ${list.join(', ')}`).join(t('pathSep')) : '—');
  row(t('kvSurfaces'), (agent.surfaces ?? []).join(' · ') || '—');
  row(t('kvPersistent'), agent.session?.persistent ? t('yes') : t('no'));
  row(t('kvResume'), agent.session?.resumeAfterRestart ? t('yes') : t('no'));
  row(t('kvCredential'), agent.session?.credential ?? '—');
  row(t('kvQuota'), agent.quota?.note ?? agent.quota?.type ?? '—');
  panel.appendChild(kv);

  const notes = el('div', 'notes');
  const title2 = el('div', 'section-title');
  title2.appendChild(el('h3', '', t('agentNotesTitle')));
  notes.appendChild(title2);
  const ul = el('ul');
  for (const n of agent.notes ?? []) ul.appendChild(el('li', '', n));
  notes.appendChild(ul);
  panel.appendChild(notes);

  const banner = el('div', 'banner');
  banner.textContent = t('agentBanner');
  panel.insertBefore(banner, panel.querySelector('.proto'));

  detail.appendChild(panel);
}

function renderDetail() {
  if (state.mode === 'providers') renderProviderDetail();
  else renderAgentDetail();
}

function applyStaticTexts() {
  document.title = t('title');
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = t('metaDesc');
  const ogDesc = document.querySelector('meta[property="og:description"]');
  if (ogDesc) ogDesc.content = t('ogDesc');
  document.getElementById('subtitle').textContent = t('subtitle');
  const endpoints = DATA.providers.reduce((n, provider) => n + (provider.endpoints?.length ?? 0), 0);
  document.getElementById('introEyebrow').textContent = t('introEyebrow');
  document.getElementById('introTitle').textContent = t('introTitle');
  document.getElementById('introLede').textContent = t('introLede', {
    p: DATA.providers.length,
    a: DATA.agents.length,
    e: endpoints,
  });
  document.getElementById('introBrowse').textContent = t('introBrowse');
  document.getElementById('introCopy').textContent = t('introCopy');
  document.getElementById('introSkill').textContent = t('introSkill');
  document.getElementById('introProviders').textContent = DATA.providers.length;
  document.getElementById('introAgents').textContent = DATA.agents.length;
  document.getElementById('introEndpoints').textContent = endpoints;
  document.getElementById('introProvidersLabel').textContent = t('introProviders');
  document.getElementById('introAgentsLabel').textContent = t('introAgents');
  document.getElementById('introEndpointsLabel').textContent = t('introEndpoints');
  document.getElementById('introUpdated').textContent = t('introUpdated', { date: DATA.updatedAt });
  document.getElementById('introNote').textContent = t('introNote');
  document.getElementById('search').placeholder = t('searchPlaceholder');
  document.getElementById('tabProviders').textContent = t('tabProviders');
  document.getElementById('tabAgents').textContent = t('tabAgents');
  document.getElementById('themeBtn').title = t('themeTitle');
  const langBtn = document.getElementById('langBtn');
  langBtn.textContent = lang === 'zh' ? 'EN' : '中文';
  langBtn.title = t('langSwitchTo');
  document.getElementById('footLeft').innerHTML = t('footLeft', { link: FOOT_LINK_HTML });
  document.getElementById('footRight').textContent = t('footRight');
}

function renderAll() {
  applyStaticTexts();
  document.getElementById('stats').textContent = t('stats', { n: DATA.providers.length, m: DATA.agents.length });
  renderChips();
  renderList();
  renderDetail();
}

document.getElementById('search').addEventListener('input', (e) => {
  state.query = e.target.value;
  renderList();
  renderDetail();
});
document.getElementById('modeSeg').addEventListener('click', (e) => {
  const mode = e.target.dataset?.mode;
  if (!mode) return;
  state.mode = mode;
  state.errors = {};
  document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  renderChips();
  renderList();
  renderDetail();
});
document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === state.mode));
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  localStorage.setItem('pr-theme', next);
});
if (localStorage.getItem('pr-theme') === 'dark') document.documentElement.dataset.theme = 'dark';

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyLangState();
  renderAll();
});

let copyResetTimer;
async function copyAgentPrompt() {
  const button = document.getElementById('introCopy');
  let copied = false;
  try {
    await navigator.clipboard.writeText(AGENT_PROMPT);
    copied = true;
  } catch {
    const area = document.createElement('textarea');
    area.value = AGENT_PROMPT;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { copied = document.execCommand('copy'); } catch { copied = false; }
    area.remove();
  }
  if (!copied) return;
  clearTimeout(copyResetTimer);
  button.textContent = t('introCopied');
  copyResetTimer = setTimeout(() => { button.textContent = t('introCopy'); }, 1800);
}

document.getElementById('introBrowse').addEventListener('click', () => {
  document.querySelector('.toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('search').focus();
});
document.getElementById('introCopy').addEventListener('click', copyAgentPrompt);

applyLangState();
renderAll();
</script>
</body>
</html>
