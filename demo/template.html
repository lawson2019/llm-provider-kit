1. Read the manifest first — it carries the current version, record counts, and canonical resource URLs. Treat it as the baseline, with Pages as primary and raw.githubusercontent.com as fallback:
   https://lawson2019.github.io/llm-provider-kit/manifest.json

2. Read the Skill guide for field mapping, auth-header rules, endpoint resolution, secret masking, and request-preview rules:
   https://lawson2019.github.io/llm-provider-kit/skills/llm-provider-kit/SKILL.md

3. Fetch the registry data listed in the manifest:
   - Providers: https://lawson2019.github.io/llm-provider-kit/data/providers.json
   - Tiers: https://lawson2019.github.io/llm-provider-kit/data/tiers.json

4. Detect my project's stack — React, Vue, Svelte, vanilla JS, or static HTML — and generate a matching provider configuration screen.

5. The screen must include:
   - A provider scope selector with three modes: common (the starter tier), all, and custom with checkboxes; custom selections must use only provider IDs from providers.json and may be deep-linked with ?scope=custom&providers=<comma-separated-ids>.
   - A searchable provider picker across the selected scope.
   - A compact runtime panel with Base URL, API Key, and Model ID. When the provider entry has probe.modelsUrl, add a "List models" action that calls that URL with the endpoint auth and lets the user choose a model; keep manual Model ID entry. Add a "Custom model" action that saves a Model ID plus optional display name into the model picker; persist only this model metadata locally, never the key.

   - A request preview with secrets masked.
   - Deep links via ?provider=<id>, using only IDs that appear in providers.json.

6. Render only fields defined in the registry — do not invent providers, endpoints, models, tiers, fields, or status labels. Before finishing, check the provider and endpoint counts against the manifest; if they differ, stop and report the mismatch instead of filling the gaps. Never save or log secrets; transmit a key only to the selected provider when the user explicitly lists models.`;

let lang = detectLang();

function t(key, vars) {
  const dict = I18N[lang] ?? I18N.zh;
  let s = dict[key] ?? I18N.zh[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, String(v));
  return s;
}

function countLabel(key, n) {
  if (lang === 'en' && n === 1) return t(`${key}One`, { n });
  return t(key, { n });
}

function applyLangState() {
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  // 保留 ?provider= 等既有深链参数，仅更新 lang。
  history.replaceState(null, '', url.pathname + url.search);
  try { localStorage.setItem(LANG_KEY, lang); } catch { /* 隐私模式下忽略 */ }
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
}

const DEMO_PARAMS = new URLSearchParams(location.search);

const ALL_PROVIDER_IDS = (DATA.providers ?? []).map((p) => p.id);
const STARTER_TIER = (DATA.tiers ?? []).find((tier) => tier.id === 'starter');
const COMMON_PROVIDER_IDS = STARTER_TIER?.providerIds?.length
  ? STARTER_TIER.providerIds.filter((id) => ALL_PROVIDER_IDS.includes(id))
  : ALL_PROVIDER_IDS.slice(0, 12);

const requestedProvider = DEMO_PARAMS.get('provider');
const requestedScope = DEMO_PARAMS.get('scope');
const initialScope = ['common', 'all', 'custom'].includes(requestedScope)
  ? requestedScope
  : (requestedProvider && !COMMON_PROVIDER_IDS.includes(requestedProvider) ? 'all' : 'common');
const requestedProviders = (DEMO_PARAMS.get('providers') ?? '')
  .split(',')
  .map((id) => id.trim())
  .filter((id) => ALL_PROVIDER_IDS.includes(id));
const initialCustomIds = initialScope === 'custom'
  ? requestedProviders
  : (requestedProviders.length ? requestedProviders : COMMON_PROVIDER_IDS);

const state = {
  scope: initialScope,
  customIds: new Set(initialCustomIds),
  category: '',
  query: '',
  selectedProvider: requestedProvider ?? (initialScope === 'custom'
    ? (initialCustomIds[0] ?? null)
    : (COMMON_PROVIDER_IDS[0] ?? ALL_PROVIDER_IDS[0] ?? null)),
  values: {},
  showAdvanced: false,
  errors: {},
  showIcons: DEMO_PARAMS.get('icons') === null ? true : DEMO_PARAMS.get('icons') !== '0',
  modelCache: {},
  customModels: {},
  customOpen: {},
};

const CUSTOM_MODELS_KEY = 'lpk-custom-models';
try {
  const stored = JSON.parse(localStorage.getItem(CUSTOM_MODELS_KEY) || '{}');
  if (stored && typeof stored === 'object' && !Array.isArray(stored)) state.customModels = stored;
} catch { /* 隐私模式下忽略 */ }

for (const p of DATA.providers ?? []) {
  const v = {};
  for (const f of p.formFields ?? []) {
    if (f.default !== undefined) v[f.key] = f.default;
  }
  state.values[p.id] = v;
}

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

function initials(name) {
  const latin = name.replace(/[^A-Za-z0-9]/g, '');
  if (latin) return latin.slice(0, 2).toUpperCase();
  return name.slice(0, 1);
}

function logoNode(provider, big = false) {
  const wrap = el('span', big ? 'logo' : 'logo');
  wrap.style.setProperty('--brand', provider.icon?.color || provider.brandColor || '#0f766e');
  wrap.appendChild(el('span', 'mono', initials(provider.name)));
  const icon = provider.icon ?? {};
  const src = icon.url || (icon.source === 'lobe-icons' && icon.slug
    ? `https://unpkg.com/@lobehub/icons-static-svg@latest/icons/${icon.slug}.svg`
    : '');
  if (src) {
    const img = new Image();
    img.alt = '';
    img.loading = 'eager';
    img.decoding = 'async';
    img.src = src;
    img.addEventListener('load', () => {
      if (img.naturalWidth > 0) wrap.classList.add('has-img');
      else img.remove();
    });
    img.addEventListener('error', () => img.remove());
    wrap.appendChild(img);
  }
  return wrap;
}

function providerIdsForScope(scope = state.scope) {
  if (scope === 'all') return new Set(ALL_PROVIDER_IDS);
  if (scope === 'custom') return new Set(state.customIds);
  return new Set(COMMON_PROVIDER_IDS);
}

function scopedProviders() {
  const ids = providerIdsForScope();
  return (DATA.providers ?? []).filter((p) => ids.has(p.id));
}

function syncUrl() {
  const url = new URL(location.href);
  url.searchParams.set('scope', state.scope);
  if (state.scope === 'custom') {
    const ids = [...state.customIds];
    if (ids.length) url.searchParams.set('providers', ids.join(','));
    else url.searchParams.delete('providers');
  } else {
    url.searchParams.delete('providers');
  }
  if (state.showIcons) url.searchParams.delete('icons');
  else url.searchParams.set('icons', '0');
  history.replaceState(null, '', url.pathname + url.search);
}

function renderScope() {
  const label = document.getElementById('scopeLabel');
  if (label) label.textContent = t('scopeLabel');
  const seg = document.getElementById('scopeSeg');
  if (!seg) return;
  seg.replaceChildren();

  const modes = [
    ['common', t('scopeCommon', { n: COMMON_PROVIDER_IDS.length }), t('scopeCommonHint')],
    ['all', t('scopeAll', { n: ALL_PROVIDER_IDS.length }), t('scopeAllHint')],
    ['custom', t('scopeCustom', { n: state.customIds.size }), t('scopeCustomHint')],
  ];
  for (const [scope, text, hint] of modes) {
    const btn = el('button', state.scope === scope ? 'on' : '', text);
    btn.type = 'button';
    btn.dataset.scope = scope;
    btn.title = hint;
    btn.setAttribute('aria-pressed', String(state.scope === scope));
    btn.onclick = () => {
      if (scope === 'custom') {
        openPicker();
        return;
      }
      state.scope = scope;
      syncUrl();
      renderAll();
    };
    seg.appendChild(btn);
  }
}

function currentProviders() {
  if (!DATA.providers) return [];
  const scopeIds = providerIdsForScope();
  return DATA.providers.filter((p) => {
    if (!scopeIds.has(p.id)) return false;
    if (state.category && p.category !== state.category) return false;
    if (!state.query) return true;
    const hay = [
      p.id, p.name, ...(p.aliases ?? []), p.kind,
      p.authType, p.auth?.mode, p.auth?.scheme,
      p.billing?.mode, p.quota?.type,
      ...(p.endpoints ?? []).flatMap((e) => [e.id, e.label, e.protocol, e.baseURL]),
    ].join(' ').toLowerCase();
    return hay.includes(state.query.toLowerCase());
  });
}

function renderChips() {
  const chips = document.getElementById('chips');
  chips.replaceChildren();
  const scopeProviders = scopedProviders();
  const allLabel = state.scope === 'all' ? t('chipAll', { n: scopeProviders.length }) : t('chipScopeAll', { n: scopeProviders.length });
  const all = el('button', `chip${state.category === '' ? ' on' : ''}`, allLabel);
  all.onclick = () => { state.category = ''; renderChips(); renderList(); renderDetail(); };
  chips.appendChild(all);
  for (const [key, label] of Object.entries(CATEGORY_LABEL[lang])) {
    const count = scopeProviders.filter((p) => p.category === key).length;
    if (!count) continue;
    const chip = el('button', `chip${state.category === key ? ' on' : ''}`, `${label} ${count}`);
    chip.onclick = () => { state.category = state.category === key ? '' : key; renderChips(); renderList(); renderDetail(); };
    chips.appendChild(chip);
  }
}

function providerBadges(p) {
  const box = el('div', 'badges');
  box.appendChild(el('span', `badge${p.kind === 'session' ? ' ses' : ''}`, kindLabel(p.kind)));
  box.appendChild(el('span', 'badge', p.auth?.mode ?? p.authType));
  box.appendChild(el('span', 'badge', `${p.auth?.scheme ?? p.authType}`));
  box.appendChild(el('span', 'badge', t('billingBadge', { mode: p.billing?.mode ?? p.quota?.type ?? '-' })));
  if (p.endpoints?.length > 1) box.appendChild(el('span', 'badge', t('endpointCount', { n: p.endpoints.length })));
  return box;
}

function renderList() {
  const list = document.getElementById('list');
  list.replaceChildren();

  const providers = currentProviders();
  if (providers.length === 0) {
    const empty = el('div', 'empty');
    if (state.scope === 'custom' && state.customIds.size === 0) {
      empty.appendChild(document.createTextNode(t('emptyCustom')));
      const choose = el('button', 'btn primary', t('emptyCustomAction'));
      choose.type = 'button';
      choose.style.marginTop = '10px';
      choose.onclick = openPicker;
      empty.appendChild(choose);
    } else {
      empty.textContent = t('emptyProvider');
    }
    list.appendChild(empty);
    return;
  }
  if (!providers.some((p) => p.id === state.selectedProvider)) {
    state.selectedProvider = providers[0].id;
  }
  for (const p of providers) {
    const btn = el('button', `item${state.selectedProvider === p.id ? ' on' : ''}`);
    if (state.showIcons) btn.appendChild(logoNode(p));
    const body = el('div', 'body');
    body.appendChild(el('div', 'name', p.name));
    const meta = el('div', 'meta');
    meta.appendChild(el('span', '', p.kind));
    meta.appendChild(el('span', '', p.auth?.mode ?? p.authType));
    body.appendChild(meta);
    btn.appendChild(body);
    btn.onclick = () => { state.selectedProvider = p.id; state.errors = {}; renderList(); renderDetail(); };
    list.appendChild(btn);
  }
}

function currentProvider() {
  return (DATA.providers ?? []).find((p) => p.id === state.selectedProvider) ?? null;
}

let pickerDraft = new Set();
let pickerQuery = '';

function filteredPickerProviders() {
  const q = pickerQuery.trim().toLowerCase();
  if (!q) return DATA.providers ?? [];
  return (DATA.providers ?? []).filter((p) => {
    const hay = [p.id, p.name, ...(p.aliases ?? []), p.category, p.kind].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function renderPicker() {
  const list = document.getElementById('pickerList');
  if (!list) return;
  list.replaceChildren();

  const matches = filteredPickerProviders();
  if (!matches.length) {
    list.appendChild(el('div', 'picker-empty', t('pickerEmpty')));
  } else {
    for (const provider of matches) {
      const item = el('label', 'picker-item');
      const cb = el('input');
      cb.type = 'checkbox';
      cb.checked = pickerDraft.has(provider.id);
      cb.onchange = () => {
        if (cb.checked) pickerDraft.add(provider.id);
        else pickerDraft.delete(provider.id);
        renderPicker();
      };
      item.appendChild(cb);
      const body = el('div', 'body');
      body.appendChild(el('div', 'name', provider.name));
      body.appendChild(el('div', 'meta', `${provider.id} · ${catLabel(provider.category)}`));
      item.appendChild(body);
      list.appendChild(item);
    }
  }

  const selected = document.getElementById('pickerSelected');
  if (selected) selected.textContent = t('pickerSelected', { n: pickerDraft.size });
  const apply = document.getElementById('pickerApply');
  if (apply) {
    apply.disabled = pickerDraft.size === 0;
    apply.textContent = t('pickerApply', { n: pickerDraft.size });
  }
  const allBtn = document.getElementById('pickerSelectAll');
  if (allBtn) allBtn.textContent = t('pickerSelectAll');
  const clearBtn = document.getElementById('pickerClear');
  if (clearBtn) clearBtn.textContent = t('pickerClear');
}

function openPicker() {
  pickerDraft = new Set(state.customIds);
  pickerQuery = '';
  const search = document.getElementById('pickerSearch');
  if (search) search.value = '';
  const title = document.getElementById('pickerTitle');
  if (title) title.textContent = t('pickerTitle');
  const hint = document.getElementById('pickerHint');
  if (hint) hint.textContent = t('pickerHint');
  const cancel = document.getElementById('pickerCancel');
  if (cancel) cancel.textContent = t('pickerCancel');
  const overlay = document.getElementById('pickerOverlay');
  if (overlay) overlay.classList.add('on');
  renderPicker();
}

function closePicker() {
  const overlay = document.getElementById('pickerOverlay');
  if (overlay) overlay.classList.remove('on');
}

function applyPicker() {
  if (pickerDraft.size === 0) return;
  state.customIds = new Set(pickerDraft);
  state.scope = 'custom';
  closePicker();
  syncUrl();
  renderAll();
}

function fieldControl(field, value, onChange, hasError) {
  const wrap = el('div', 'control');
  let input;

  if (field.type === 'select') {
    input = el('select');
    for (const option of field.options ?? []) {
      const opt = el('option', '', optLabel(option.label));
      opt.value = option.value;
      if (option.description) opt.title = option.description;
      input.appendChild(opt);
    }
    input.value = value ?? field.default ?? '';
  } else if (field.type === 'boolean') {
    input = el('input');
    input.type = 'checkbox';
    input.checked = Boolean(value ?? field.default);
    input.style.width = 'auto';
    wrap.classList.add('switch');
  } else if (field.type === 'textarea' || field.type === 'json') {
    input = el('textarea');
    input.value = value ?? field.default ?? '';
    input.placeholder = field.placeholder ?? '';
  } else if (field.type === 'number') {
    input = el('input');
    input.type = 'number';
    if (field.validate?.min !== undefined) input.min = field.validate.min;
    if (field.validate?.max !== undefined) input.max = field.validate.max;
    input.value = value ?? field.default ?? '';
  } else {
    input = el('input');
    input.type = field.type === 'password' ? 'password' : field.type === 'url' ? 'url' : 'text';
    input.value = value ?? field.default ?? '';
    input.placeholder = field.placeholder ?? '';
    input.autocomplete = 'off';
    input.spellcheck = false;
  }

  input.dataset.fieldKey = field.key;
  if (hasError) input.classList.add('bad');
  input.addEventListener('input', () => {
    const v = field.type === 'boolean' ? input.checked : input.value;
    onChange(v);
  });
  input.addEventListener('change', () => {
    const v = field.type === 'boolean' ? input.checked : input.value;
    onChange(v);
  });
  wrap.appendChild(input);

  if (field.type === 'password') {
    const peek = el('button', 'peek', t('show'));
    peek.type = 'button';
    peek.onclick = () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      peek.textContent = showing ? t('show') : t('hide');
    };
    wrap.appendChild(peek);
  }
  return wrap;
}

function secretField(provider) {
  return (provider.formFields ?? []).find((field) => field.secret === true) ?? null;
}

function hasModelField(provider) {
  return (provider.formFields ?? []).some((field) => field.key === 'model');
}

function baseURLFor(provider, values) {
  const endpoint = resolveEndpoint(provider, values);
  let base = values.baseURL || endpoint?.baseURL || provider.baseURL || '';
  if (provider.baseURLTemplate) base = interpolate(provider.baseURLTemplate, values);
  else if (String(base).includes('{')) base = interpolate(base, values);
  return String(base ?? '').replace(/\/+$/, '');
}

function modelsURLFor(provider, values) {
  const raw = provider.probe?.modelsUrl;
  if (!raw) return '';
  if (/^https?:\/\//i.test(raw)) return raw;
  const base = baseURLFor(provider, values);
  if (!base || base.includes('{')) return '';
  return `${base}${raw.startsWith('/') ? '' : '/'}${raw}`;
}

function buildModelsRequest(provider, values) {
  const modelsURL = modelsURLFor(provider, values);
  if (!modelsURL) return { error: 'no-models-url' };

  const endpoint = resolveEndpoint(provider, values);
  const auth = provider.auth ?? {};
  const endpointAuth = endpoint?.auth ?? {};
  const scheme = endpointAuth.scheme ?? auth.scheme ?? provider.authType;
  const headerName = endpointAuth.headerName ?? auth.headerName;
  const queryName = endpointAuth.queryName ?? auth.queryName;
  const secret = secretField(provider);
  const credential = secret ? String(values[secret.key] ?? '') : '';
  const headers = { Accept: 'application/json' };
  const query = {};

  if (scheme === 'aws-sigv4' || scheme === 'jwt-session' || scheme === 'cookie') {
    return { error: 'unsupported-auth' };
  }

  switch (scheme) {
    case 'bearer':
      if (credential) headers.Authorization = `Bearer ${credential}`;
      break;
    case 'api-key-header':
      if (credential) headers[headerName ?? 'x-api-key'] = credential;
      break;
    case 'query-param':
      if (credential) query[queryName ?? 'key'] = credential;
      break;
    case 'azure-api-key':
      if (credential) headers['api-key'] = credential;
      query['api-version'] = values.apiVersion || '2024-10-21';
      break;
    case 'none':
      break;
  }

  for (const [name, value] of Object.entries(auth.extraHeaders ?? {})) {
    const resolved = interpolate(value, values);
    if (!resolved.includes('{')) headers[name] = resolved;
  }
  for (const [name, value] of Object.entries(endpoint?.headers ?? {})) {
    const resolved = interpolate(value, values);
    if (!resolved.includes('{')) headers[name] = resolved;
  }

  let url = modelsURL;
  if (Object.keys(query).length) {
    const parsed = new URL(modelsURL);
    for (const [key, value] of Object.entries(query)) parsed.searchParams.set(key, value);
    url = parsed.toString();
  }
  return { url, headers, method: provider.probe?.method ?? 'GET' };
}

function parseModels(payload) {
  const raw = Array.isArray(payload)
    ? payload
    : payload?.data ?? payload?.models ?? payload?.result ?? [];
  if (!Array.isArray(raw)) return [];
  const seen = new Set();
  const models = [];
  for (const item of raw) {
    const value = typeof item === 'string'
      ? item
      : item?.id ?? item?.name ?? item?.model ?? item?.slug;
    if (!value) continue;
    const id = String(value).replace(/^models\//, '').trim();
    if (!id || seen.has(id)) continue;
    seen.add(id);
    models.push(id);
  }
  return models.sort((a, b) => a.localeCompare(b));
}

function syncFieldInputs(provider, values) {
  for (const input of document.querySelectorAll('.detail [data-field-key]')) {
    const value = values[input.dataset.fieldKey];
    if (value === undefined || value === null) continue;
    if (input.type === 'checkbox') input.checked = Boolean(value);
    else if (input.value !== String(value)) input.value = String(value);
  }
}

async function loadModels(provider, values) {
  const status = document.querySelector('.quick-status');
  const request = buildModelsRequest(provider, values);
  if (request.error === 'no-models-url') {
    state.modelCache[provider.id] = { error: 'unsupported' };
    renderDetail();
    return;
  }
  if (request.error === 'unsupported-auth') {
    state.modelCache[provider.id] = { error: 'unsupported-auth' };
    renderDetail();
    return;
  }

  if (status) {
    status.className = 'quick-status';
    status.textContent = t('modelsLoading');
  }
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    let response;
    try {
      response = await fetch(request.url, {
        method: request.method,
        headers: request.headers,
        signal: controller.signal,
        cache: 'no-store',
      });
    } finally {
      clearTimeout(timer);
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.json();
    const models = parseModels(payload);
    if (!models.length) throw new Error('empty');
    state.modelCache[provider.id] = { models, at: Date.now() };
  } catch {
    state.modelCache[provider.id] = { error: 'failed' };
  }
  renderDetail();
}

function customModelsFor(provider) {
  const list = state.customModels[provider.id];
  return Array.isArray(list)
    ? list.filter((item) => item && typeof item.id === 'string' && item.id.trim())
    : [];
}

function persistCustomModels() {
  try { localStorage.setItem(CUSTOM_MODELS_KEY, JSON.stringify(state.customModels)); } catch { /* 隐私模式下忽略 */ }
}

function setModelValue(provider, values, id, label = '', custom = false) {
  values.model = id;
  values.modelLabel = label;
  values.customModel = custom;
  const input = document.querySelector('.quick-field input[data-field-key="model"]');
  if (input) input.value = id;
  syncFieldInputs(provider, values);
  refreshOutput(provider, values);
}

function renderQuickConfig(provider, values) {
  const box = el('div', 'quick');
  const head = el('div', 'quick-head');
  head.appendChild(el('h3', '', t('quickTitle')));
  head.appendChild(el('span', 'quick-hint', t('quickHint')));
  box.appendChild(head);

  const grid = el('div', 'quick-grid');

  const baseField = el('div', 'quick-field');
  const baseLabel = el('label', '', t('quickBase'));
  const base = el('input');
  base.type = 'url';
  base.value = baseURLFor(provider, values);
  base.placeholder = 'https://api.example.com/v1';
  base.autocomplete = 'off';
  base.spellcheck = false;
  base.dataset.fieldKey = 'baseURL';
  if (provider.baseURLTemplate) {
    base.readOnly = true;
    base.title = t('quickTemplateBase');
  }
  base.addEventListener('input', () => {
    if (provider.baseURLTemplate) return;
    values.baseURL = base.value.trim();
    syncFieldInputs(provider, values);
    refreshOutput(provider, values);
  });
  baseField.append(baseLabel, base);
  if (provider.baseURLTemplate) baseField.appendChild(el('div', 'help', t('quickTemplateBase')));
  else if (base.value) baseField.appendChild(el('div', 'help', base.value));
  grid.appendChild(baseField);

  const keyField = el('div', 'quick-field');
  const keyLabel = el('label', '', t('quickKey'));
  const secret = secretField(provider);
  if (secret) {
    const key = el('input');
    key.type = 'password';
    key.value = values[secret.key] ?? secret.default ?? '';
    key.placeholder = secret.placeholder ?? 'sk-...';
    key.autocomplete = 'off';
    key.spellcheck = false;
    key.dataset.fieldKey = secret.key;
    key.addEventListener('input', () => {
      values[secret.key] = key.value;
      syncFieldInputs(provider, values);
      refreshOutput(provider, values);
    });
    const row = el('div', 'quick-row');
    row.appendChild(key);
    const peek = el('button', 'btn', t('show'));
    peek.type = 'button';
    peek.onclick = () => {
      const showing = key.type === 'text';
      key.type = showing ? 'password' : 'text';
      peek.textContent = showing ? t('show') : t('hide');
    };
    row.appendChild(peek);
    keyField.append(keyLabel, row);
  } else {
    const empty = el('input');
    empty.type = 'text';
    empty.disabled = true;
    empty.placeholder = t('quickNoKey');
    keyField.append(keyLabel, empty);
  }
  keyField.appendChild(el('div', 'help', t('quickKeyNote')));
  grid.appendChild(keyField);

  const modelField = el('div', 'quick-field');
  const modelLabel = el('label', '', t('quickModel'));
  const modelInput = el('input');
  modelInput.type = 'text';
  modelInput.value = values.model ?? '';
  modelInput.placeholder = 'gpt-4o-mini / claude-sonnet-4-5';
  modelInput.autocomplete = 'off';
  modelInput.spellcheck = false;
  modelInput.dataset.fieldKey = 'model';
  modelInput.addEventListener('input', () => {
    values.model = modelInput.value.trim();
    values.customModel = true;
    values.modelLabel = '';
    syncFieldInputs(provider, values);
    refreshOutput(provider, values);
  });
  const modelRow = el('div', 'quick-row');
  modelRow.appendChild(modelInput);
  const list = el('button', 'btn', t('listModels'));
  list.type = 'button';
  if (!provider.probe?.modelsUrl) list.disabled = true;
  list.onclick = () => loadModels(provider, values);
  modelRow.appendChild(list);
  modelField.append(modelLabel, modelRow);
  if (!hasModelField(provider)) modelField.appendChild(el('div', 'help', t('modelsHint')));

  const customToggle = el('button', 'quick-custom-link', t('quickCustom'));
  customToggle.type = 'button';
  customToggle.title = t('quickCustomHint');
  customToggle.onclick = () => {
    state.customOpen[provider.id] = !state.customOpen[provider.id];
    renderDetail();
  };
  modelField.appendChild(customToggle);

  const customModels = customModelsFor(provider);
  if (state.customOpen[provider.id]) {
    const editor = el('div', 'quick-custom-editor');
    const idInput = el('input');
    idInput.type = 'text';
    idInput.value = values.customModel ? (values.model ?? '') : '';
    idInput.placeholder = t('customId');
    idInput.autocomplete = 'off';
    idInput.spellcheck = false;
    const labelInput = el('input');
    labelInput.type = 'text';
    labelInput.value = values.customModel ? (values.modelLabel ?? '') : '';
    labelInput.placeholder = t('customLabel');
    labelInput.autocomplete = 'off';
    const acts = el('div', 'acts');
    const save = el('button', 'btn primary', t('customSave'));
    save.type = 'button';
    const cancel = el('button', 'btn', t('customCancel'));
    cancel.type = 'button';
    save.onclick = () => {
      const id = idInput.value.trim();
      if (!id) {
        idInput.classList.add('bad');
        idInput.placeholder = t('customInvalid');
        idInput.focus();
        return;
      }
      const label = labelInput.value.trim();
      const list = customModelsFor(provider).filter((item) => item.id !== id);
      list.push({ id, label });
      state.customModels[provider.id] = list;
      persistCustomModels();
      state.customOpen[provider.id] = false;
      setModelValue(provider, values, id, label, true);
      renderDetail();
    };
    cancel.onclick = () => {
      state.customOpen[provider.id] = false;
      renderDetail();
    };
    acts.append(save, cancel);
    editor.append(idInput, labelInput, acts);
    modelField.appendChild(editor);
  }

  if (customModels.length) {
    const chips = el('div', 'quick-custom-list');
    for (const item of customModels) {
      const chip = el('span', 'custom-chip');
      const use = el('button', '', `${item.id}${item.label ? ` · ${item.label}` : ''}`);
      use.type = 'button';
      use.title = t('customTag');
      use.onclick = () => setModelValue(provider, values, item.id, item.label, true);
      const remove = el('button', 'x', '×');
      remove.type = 'button';
      remove.title = t('customRemove');
      remove.onclick = () => {
        state.customModels[provider.id] = customModelsFor(provider).filter((entry) => entry.id !== item.id);
        persistCustomModels();
        renderDetail();
      };
      chip.append(use, el('span', 'tag', t('customTag')), remove);
      chips.appendChild(chip);
    }
    modelField.appendChild(chips);
  }
  grid.appendChild(modelField);

  box.appendChild(grid);

  const foot = el('div', 'quick-foot');
  const cache = state.modelCache[provider.id];
  const customIds = new Set(customModels.map((item) => item.id));
  const allModelIds = [...new Set([
    ...(cache?.models ?? []),
    ...customModels.map((item) => item.id),
  ])];
  if (allModelIds.length) {
    const select = el('select', 'quick-models');
    const placeholder = el('option', '', t('modelsSelect'));
    placeholder.value = '';
    select.appendChild(placeholder);
    for (const id of allModelIds) {
      const custom = customIds.has(id);
      const customLabel = customModels.find((item) => item.id === id)?.label;
      const opt = el('option', '', `${id}${custom ? ` · ${t('customTag')}${customLabel ? ` · ${customLabel}` : ''}` : ''}`);
      opt.value = id;
      select.appendChild(opt);
    }
    select.value = allModelIds.includes(values.model) ? values.model : '';
    select.onchange = () => {
      if (!select.value) return;
      const custom = customIds.has(select.value);
      const customLabel = customModels.find((item) => item.id === select.value)?.label ?? '';
      modelInput.value = select.value;
      setModelValue(provider, values, select.value, customLabel, custom);
    };
    foot.appendChild(select);
    const loaded = cache?.models?.length ? t('modelsLoaded', { n: cache.models.length }) : `${customModels.length} ${t('customTag')}`;
    foot.appendChild(el('span', 'quick-status ok', loaded));
  } else {
    const status = el('span', `quick-status${cache?.error ? ' err' : ''}`);
    if (cache?.error === 'failed') status.textContent = t('modelsFailed');
    else if (cache?.error === 'unsupported') status.textContent = t('modelsUnsupported');
    else if (cache?.error === 'unsupported-auth') status.textContent = t('modelsUnsupported');
    else status.textContent = provider.probe?.modelsUrl ? t('modelsHint') : t('modelsUnsupported');
    foot.appendChild(status);
  }

  const iconLabel = el('label', 'quick-switch');
  const icon = el('input');
  icon.type = 'checkbox';
  icon.checked = state.showIcons;
  icon.onchange = () => {
    state.showIcons = icon.checked;
    syncUrl();
    renderList();
    renderDetail();
  };
  iconLabel.append(icon, document.createTextNode(t('showIcons')));
  iconLabel.title = t('iconsHint');
  foot.appendChild(iconLabel);
  box.appendChild(foot);
  return box;
}

function renderForm(provider) {
  const box = el('div');

  if (provider.quotaWarning) {
    const banner = el('div', `banner ${provider.quotaWarning.level === 'warning' ? 'warn' : ''}`);
    banner.appendChild(el('strong', '', provider.quotaWarning.title));
    banner.appendChild(document.createTextNode(provider.quotaWarning.detail));
    box.appendChild(banner);
  }

  const values = state.values[provider.id] ?? (state.values[provider.id] = {});
  const groups = {};
  for (const f of provider.formFields ?? []) (groups[f.group ?? 'advanced'] ??= []).push(f);

  const basicGroups = Object.entries(groups).filter(([g]) => g !== 'advanced');
  const advanced = groups.advanced ?? [];

  for (const [group, fields] of basicGroups) {
    box.appendChild(renderGroup(provider, group, fields, values));
  }
  if (advanced.length) {
    const toggle = el('button', 'adv-toggle', state.showAdvanced ? t('advHide') : t('advShow', { n: advanced.length }));
    toggle.onclick = () => { state.showAdvanced = !state.showAdvanced; renderDetail(); };
    box.appendChild(toggle);
    if (state.showAdvanced) box.appendChild(renderGroup(provider, 'advanced', advanced, values));
  }

  const out = el('div', 'output');
  const head = el('div', 'output-head');
  head.appendChild(el('span', '', t('outputTitle')));
  const acts = el('div', 'acts');
  const gen = el('button', 'mini', t('validateBtn'));
  const copy = el('button', 'mini', t('copyBtn'));
  acts.append(gen, copy);
  head.appendChild(acts);
  out.appendChild(head);

  const pre = el('pre');
  const problems = el('div', 'problems');
  out.append(pre, problems);

  const update = () => {
    const config = buildConfig(provider, values);
    pre.textContent = JSON.stringify(config, null, 2);
    if (Object.keys(state.errors).length) {
      problems.classList.add('on');
      problems.textContent = t('missingFields', { keys: Object.keys(state.errors).join(t('listSep')) });
    } else {
      problems.classList.remove('on');
      problems.textContent = '';
    }
  };

  gen.onclick = () => {
    state.errors = {};
    for (const f of provider.formFields ?? []) {
      if (f.required && !String(values[f.key] ?? '').trim()) state.errors[f.key] = true;
    }
    renderDetail();
  };
  copy.onclick = async () => {
    const text = JSON.stringify(buildConfig(provider, values), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = t('copied');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      copy.textContent = t('copied');
    }
    setTimeout(() => (copy.textContent = t('copyBtn')), 1400);
  };

  update();
  box.appendChild(out);

  if (provider.notes?.length) {
    const notes = el('div', 'notes');
    const title = el('div', 'section-title');
    title.appendChild(el('h3', '', t('notesTitle')));
    notes.appendChild(title);
    const ul = el('ul');
    for (const note of provider.notes) ul.appendChild(el('li', '', note));
    notes.appendChild(ul);
    box.appendChild(notes);
  }

  return box;
}

function renderGroup(provider, group, fields, values) {
  const wrap = el('div', 'group');
  const head = el('div', 'group-head');
  head.appendChild(el('span', '', groupLabel(group)));
  head.appendChild(el('span', '', countLabel('fieldCount', fields.length)));
  const body = el('div', 'group-body');

  for (const rawField of fields) {
    const field = locField(rawField);
    const row = el('div', 'field');
    const label = el('label');
    label.appendChild(document.createTextNode(field.label));
    if (field.required) label.appendChild(el('span', 'req', t('tagRequired')));
    if (field.secret) label.appendChild(el('span', 'tag secret', t('tagSecret')));
    if (field.advanced) label.appendChild(el('span', 'tag', t('tagAdvanced')));
    body.appendChild(row);
    row.appendChild(label);

    const control = fieldControl(field, values[field.key], (v) => {
      values[field.key] = v;
      if (state.errors[field.key] && String(v).trim()) {
        delete state.errors[field.key];
      }
      syncFieldInputs(provider, values);
      refreshOutput(provider, values);
    }, Boolean(state.errors[field.key]));
    row.appendChild(control);

    if (field.help) row.appendChild(el('div', 'help', field.help));
    if (field.type === 'select' && field.options) {
      const active = field.options.find((o) => o.value === (values[field.key] ?? field.default));
      if (active?.description) row.appendChild(el('div', 'help', t('current', { desc: active.description })));
    }
  }

  wrap.append(head, body);
  return wrap;
}

function refreshOutput(provider, values) {
  const pre = document.querySelector('.output pre');
  if (!pre) return;
  pre.textContent = JSON.stringify(buildConfig(provider, values), null, 2);
}

function interpolate(template, values) {
  return template.replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => {
    const v = values[key];
    return v === undefined || v === null || v === '' ? `{${key}}` : String(v);
  });
}

function resolveEndpoint(provider, values) {
  const endpoints = provider.endpoints ?? [];
  const selectedValue = values.endpoint ?? values.endpointId;
  if (selectedValue !== undefined && selectedValue !== null && selectedValue !== '') {
    const selected = endpoints.find((e) => e.id === selectedValue || e.value === selectedValue);
    if (selected) return selected;
  }
  return endpoints.find((e) => e.default === true) ?? endpoints[0] ?? null;
}

  'openai-chat': '/chat/completions',
  'openai-responses': '/responses',
  'anthropic-messages': '/v1/messages',
};

function endpointPath(endpoint) {
  return endpoint?.path ?? (DEFAULT_ENDPOINT_PATH[endpoint?.protocol] ?? '');
}

function endpointURL(endpoint) {
  if (!endpoint?.baseURL) return st.localSessionURL;
  const base = String(endpoint.baseURL).replace(/\/+$/, '');
  const path = endpointPath(endpoint);
  if (!path || base.endsWith(path)) return base;
  return `${base}${path.startsWith('/') ? '' : '/'}${path}`;
}

function maskCredential(value) {
  const raw = String(value ?? '');
  if (!raw) return '';
  if (raw.length <= 8) return '••••';
  return `${raw.slice(0, 4)}…${raw.slice(-4)}`;
}

function buildConfig(provider, values) {
  const headers = {};
  const query = {};
  const missing = [];
  const warnings = [];

  for (const f of provider.formFields ?? []) {
    const value = values[f.key] ?? f.default;
    if (f.required && !String(value ?? '').trim()) missing.push(f.key);
  }

  const endpoint = resolveEndpoint(provider, values);
  let baseURL = values.baseURL || endpoint?.baseURL || provider.baseURL || '';
  if (provider.baseURLTemplate) baseURL = interpolate(provider.baseURLTemplate, values);
  else if (baseURL.includes('{')) baseURL = interpolate(baseURL, values);
  if (provider.kind === 'session') baseURL = st.sessionBaseURL;

  const auth = provider.auth ?? {};
  const endpointAuth = endpoint?.auth ?? {};
  const authMode = endpointAuth.mode ?? auth.mode ?? (provider.kind === 'session' ? 'local-session' : provider.authType === 'none' ? 'none' : 'api-key');
  const scheme = endpointAuth.scheme ?? auth.scheme ?? provider.authType;
  const headerName = endpointAuth.headerName ?? auth.headerName;
  const queryName = endpointAuth.queryName ?? auth.queryName;
  const credentialField = (provider.formFields ?? []).find((f) => f.secret === true);
  const credential = credentialField ? (values[credentialField.key] || '') : '';
  const masked = maskCredential(credential);

  const defaultPath = DEFAULT_ENDPOINT_PATH[endpoint?.protocol] ?? '';
  const path = endpoint?.path ?? defaultPath;
  let requestURL = baseURL ? String(baseURL).replace(/\/+$/, '') : '';
  if (requestURL && path && !requestURL.endsWith(path)) {
    requestURL = `${requestURL}${path.startsWith('/') ? '' : '/'}${path}`;
  }

  if (authMode === 'oauth' || authMode === 'device-code') {
    warnings.push(st.wOauth);
  }
  if (authMode === 'browser-cookie') {
    warnings.push(st.wCookie);
  }
  if (authMode === 'local-session') {
    warnings.push(st.wLocalSession);
  }

  switch (scheme) {
    case 'bearer':
      headers.Authorization = credential ? `Bearer ${masked}` : `Bearer ${st.phUnfilled}`;
      break;
    case 'api-key-header':
      headers[headerName ?? 'x-api-key'] = credential ? masked : st.phUnfilled;
      break;
    case 'query-param':
      query[queryName ?? 'key'] = credential ? masked : st.phUnfilled;
      break;
    case 'azure-api-key':
      headers['api-key'] = credential ? masked : st.phUnfilled;
      query['api-version'] = values.apiVersion || '2024-10-21';
      break;
    case 'aws-sigv4':
      headers['X-Amz-Date'] = st.awsDate;
      headers.Authorization = st.awsAuth;
      break;
    case 'cookie':
      headers.Cookie = credential ? masked : st.phUnfilled;
      break;
    case 'jwt-session':
      headers.Authorization = st.jwtSession;
      break;
  }

  for (const [name, value] of Object.entries(auth.extraHeaders ?? {})) {
    const resolved = interpolate(value, values);
    if (!resolved.includes('{')) headers[name] = resolved;
  }
  for (const [name, value] of Object.entries(endpoint?.headers ?? {})) {
    const resolved = interpolate(value, values);
    if (!resolved.includes('{')) headers[name] = resolved;
  }

  if (provider.kind === 'session') warnings.push(st.wSession);
  if (provider.risk && ['medium', 'high'].includes(provider.risk.level)) {
    warnings.push(st.wRisk.replaceAll('{level}', provider.risk.level).replaceAll('{note}', provider.risk.note));
  }
  if (provider.runtime?.forceStream) warnings.push(st.wStream);
  if (provider.runtime?.strictChatHistory) warnings.push(st.wHistory);

  return {
    baseURL,
    model: values.model ? String(values.model) : null,
    modelLabel: values.modelLabel ? String(values.modelLabel) : null,
    endpoint: endpoint?.id ?? 'default',
    protocol: endpoint?.protocol ?? 'unknown',
    path,
    requestURL,
    headers,
    query,
    missing,
    warnings,
    quota: provider.quota?.type,
    billing: provider.billing?.mode ?? provider.quota?.type,
    authMode,
    runtime: provider.runtime ?? null,
  };
}

    copied = true;
