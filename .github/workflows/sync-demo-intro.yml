name: sync-demo-intro

on:
  push:
    paths:
      - '.github/workflows/sync-demo-intro.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download payload
        run: curl -fsSL https://aka.doubaocdn.com/s/5nYsLtULUG -o /tmp/payload.tar.gz
      - name: Extract demo animation assets
        run: tar -xzf /tmp/payload.tar.gz -C .
      - name: Validate and rebuild
        run: |
          node bin/cli.mjs validate
          node scripts/smoke.mjs
          node scripts/build-demo.mjs
          npm run test:all
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/template.html demo/index.html demo/demo-intro.gif
          git commit -m "feat: refine 8-second provider kit intro animation" || echo "nothing to commit"
          git push
      - name: Dispatch Pages
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
