name: sync-demo-page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip sync-demo]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch updated assets
        run: |
          curl -fsSL -o demo/template.html "https://aka.doubaocdn.com/s/SSYEVVt3kG"
          curl -fsSL -o docs/preview.png "https://aka.doubaocdn.com/s/bZDY704bnT"
          curl -fsSL -o docs/demo-code-animation.mp4 "https://aka.doubaocdn.com/s/cMsRreFlZ2"

      - name: Rebuild demo
        run: node scripts/build-demo.mjs

      - name: Commit updated demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/template.html demo/index.html docs/preview.png docs/demo-code-animation.mp4
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "feat: add project intro to demo and refresh preview [skip sync-demo]"
          git push
