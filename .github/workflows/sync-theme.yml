name: sync-theme

on:
  push:
    paths:
      - .github/workflows/sync-theme.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/rSfrQLoUIw" -o /tmp/lpk-theme.zip
          unzip -t /tmp/lpk-theme.zip

      - name: Apply files
        run: unzip -o /tmp/lpk-theme.zip -d .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/template.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat(demo): ASCII + pixels theme"
          git push
