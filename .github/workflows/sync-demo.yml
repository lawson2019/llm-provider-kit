name: sync-demo

on:
  push:
    paths:
      - .github/workflows/sync-demo.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/AWVcbn5zEC" -o /tmp/lpk-sync.zip
          unzip -t /tmp/lpk-sync.zip >/tmp/unzip-check.txt
          cat /tmp/unzip-check.txt

      - name: Apply files
        run: unzip -o /tmp/lpk-sync.zip -d .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md README.es.md README.fr.md README.ja.md README.ko.md llms.txt manifest.json demo/template.html scripts/build-demo.mjs skills/llm-provider-kit/SKILL.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat(demo): provider scope, quick runtime config, custom models"
          git push
