name: sync-card

on:
  push:
    paths:
      - .github/workflows/sync-card.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/AqjXlI83ns" -o /tmp/lpk-card.zip
          unzip -t /tmp/lpk-card.zip

      - name: Apply files
        run: unzip -o /tmp/lpk-card.zip -d .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/template.html docs/x-card.png
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat(social): add X/Twitter summary_large_image card"
          git push
