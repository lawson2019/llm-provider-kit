name: sync-demo-live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-demo-live.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-demo-live
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest ASCII template
        run: curl -fsSL "https://aka.doubaocdn.com/s/tClAegnDvO" -o demo/template.html

      - name: Rebuild single-file demo
        run: node scripts/build-demo.mjs

      - name: Commit template and built demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/template.html demo/index.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(demo): sync ASCII tour panel"
            git push origin HEAD:main
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/skills/llm-provider-kit _site/schemas
          cp demo/index.html _site/index.html
          cp docs/preview.svg _site/preview.svg
          cp docs/x-card.png _site/x-card.png
          cp manifest.json llms.txt _site/
          cp schemas/provider.schema.json _site/schemas/provider.schema.json
          cp data/providers.json data/tiers.json _site/data/
          cp skills/llm-provider-kit/SKILL.md _site/skills/llm-provider-kit/SKILL.md
          if [ -f skills/llm-provider-kit/reference.md ]; then cp skills/llm-provider-kit/reference.md _site/skills/llm-provider-kit/reference.md; fi
          if [ -f skills/llm-provider-kit/examples/example-prompt.md ]; then mkdir -p _site/skills/llm-provider-kit/examples && cp skills/llm-provider-kit/examples/example-prompt.md _site/skills/llm-provider-kit/examples/example-prompt.md; fi
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "deploy: sync ascii tour panel"

      - name: Request Pages build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /tmp/pages-build.json
          cat /tmp/pages-build.json
