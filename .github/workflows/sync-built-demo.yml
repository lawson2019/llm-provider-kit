name: sync-built-demo

on:
  push:
    paths:
      - .github/workflows/sync-built-demo.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built demo
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/VVobK8zJXu" -o /tmp/lpk-index.zip
          unzip -t /tmp/lpk-index.zip
      - name: Apply
        run: unzip -o /tmp/lpk-index.zip -d .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: sync ASCII demo build"
          git push
