name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build single-file demo
        run: node scripts/build-demo.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp docs/preview.png _site/preview.png
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "deploy: publish demo site"
