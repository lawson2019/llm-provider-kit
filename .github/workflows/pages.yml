name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build single-file demo
        run: node scripts/build-demo.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/skills/llm-provider-kit _site/schemas
          cp demo/index.html _site/index.html
          cp demo/demo-intro.gif _site/demo-intro.gif
          cp demo/demo-intro.mp4 _site/demo-intro.mp4
          cp docs/preview.svg _site/preview.svg
          cp manifest.json llms.txt _site/
          cp schemas/provider.schema.json _site/schemas/provider.schema.json
          cp data/providers.json data/tiers.json _site/data/
          cp skills/llm-provider-kit/SKILL.md _site/skills/llm-provider-kit/SKILL.md
          if [ -f skills/llm-provider-kit/reference.md ]; then cp skills/llm-provider-kit/reference.md _site/skills/llm-provider-kit/reference.md; fi
          if [ -f skills/llm-provider-kit/examples/example-prompt.md ]; then mkdir -p _site/skills/llm-provider-kit/examples && cp skills/llm-provider-kit/examples/example-prompt.md _site/skills/llm-provider-kit/examples/example-prompt.md; fi
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "deploy: publish provider-only demo site"

      - name: Request Pages build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /tmp/pages-build.json
          cat /tmp/pages-build.json
