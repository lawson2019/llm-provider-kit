name: bootstrap-sync

on:
  push:
    paths:
      - .github/workflows/bootstrap-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download registry snapshot
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/registry.tar.gz https://aka.doubaocdn.com/s/Vgkg8NZoN5
          ls -l /tmp/registry.tar.gz

      - name: Extract snapshot into repository root
        run: |
          set -euo pipefail
          tar xzf /tmp/registry.tar.gz -C .

      - name: Remove obsolete audit document
        run: git rm -f --ignore-unmatch docs/audit-omniroute-import.md || true

      - name: Commit and push synced registry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No changes after snapshot extraction; skipping commit."
            exit 0
          fi
          git commit -m "chore: sync provider registry to 108 providers / 7 agents"
          git push origin main
